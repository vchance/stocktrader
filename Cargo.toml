[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
st-core = { path = "crates/core" }
st-data = { path = "crates/data" }
st-engine = { path = "crates/engine" }
st-fundamentals = { path = "crates/fundamentals" }
st-marketdata = { path = "crates/marketdata" }
st-risk = { path = "crates/risk" }
st-strategies = { path = "crates/strategies" }

anyhow = "1"
arrow-array = "60"
arrow-schema = "60"
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
dotenvy = "0.15"
flate2 = "1"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
wiremock = "0.6"
zip = { version = "9", default-features = false, features = ["deflate"] }
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
