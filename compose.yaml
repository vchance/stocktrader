# Start with deploy/collector.sh, which sets COLLECTOR_UID/GID and creates .env and data/ with the right owner.
services:
  collector:
    build: .
    image: stocktrader-collector
    restart: unless-stopped
    # Run as the host user so archive files in ./data are owned by them, not root. deploy/collector.sh
    # exports the real IDs; the defaults only let plain `docker compose logs/stop` work without it.
    user: "${COLLECTOR_UID:-1000}:${COLLECTOR_GID:-1000}"
    # Plain KEY=value lines; Docker does not strip quotes the way dotenv does.
    env_file: .env
    volumes:
      - ./data:/data
    # Long enough for an in-flight archive write to finish after SIGTERM.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
