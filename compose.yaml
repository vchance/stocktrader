# Manage with deploy/collector.sh, which sets COLLECTOR_UID/GID and creates .env and data/ with the right owner.
name: stocktrader-collector

x-common: &common
  build: .
  image: vchance-stocktrader
  # Run as the host user so files in ./data are owned by them, not root. Required rather than defaulted
  # so a bare `docker compose up` can't recreate a container as a user who can't write data/.
  user: "${COLLECTOR_UID:?run deploy/collector.sh}:${COLLECTOR_GID:?run deploy/collector.sh}"
  # Compose's parser is not dotenv: keep values unquoted, and avoid `$` (interpolated) and ` #` (comment).
  env_file:
    - path: .env
      required: false
  volumes:
    - ./data:/data
  # Only /data is writable; a misdirected write should fail loudly, not vanish on rebuild.
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Shared host: keep a runaway process from starving other services.
  cpus: 1.0
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  collector:
    <<: *common
    restart: unless-stopped
    environment:
      # Pinned here (overrides env_file) so nothing in .env can move the archive off the bind mount.
      STOCKTRADER_DATA_DIR: /data/raw
    mem_limit: 512m
    # Long enough for an in-flight archive write to finish after SIGTERM.
    stop_grace_period: 30s

  # One-shot nightly job, started by deploy/collector.sh sync-marketdata (and its systemd timer), never by `up`.
  marketdata:
    <<: *common
    profiles: [tools]
    restart: "no"
    entrypoint: ["marketdata"]
    command: ["sync"]
    environment:
      STOCKTRADER_MARKETDATA_DIR: /data/marketdata
    mem_limit: 1g

  # One-shot daily job, started by deploy/collector.sh sync-fundamentals (and its systemd timer).
  fundamentals:
    <<: *common
    profiles: [tools]
    restart: "no"
    entrypoint: ["fundamentals"]
    command: ["sync"]
    environment:
      STOCKTRADER_FUNDAMENTALS_DIR: /data/fundamentals
    mem_limit: 1g

  # One-shot rebuild of derived signal tables from the raw archive, run by deploy/collector.sh housekeeping.
  signals:
    <<: *common
    profiles: [tools]
    restart: "no"
    entrypoint: ["signals"]
    command: ["apewisdom"]
    environment:
      STOCKTRADER_DATA_DIR: /data/raw
      STOCKTRADER_SIGNALS_DIR: /data/signals
    mem_limit: 1g

  # One-shot pre-open paper-trading run, started by deploy/collector.sh paper-trade (and its systemd timer).
  paper:
    <<: *common
    profiles: [tools]
    restart: "no"
    entrypoint: ["stocktrader", "paper"]
    # Plan files come from the checkout, read-only; reports are written under data/.
    volumes:
      - ./data:/data
      - ./plans:/plans:ro
    environment:
      STOCKTRADER_MARKETDATA_DIR: /data/marketdata
      STOCKTRADER_LIVE_DIR: /data/live
      STOCKTRADER_PLANS_DIR: /plans
      STOCKTRADER_REPORTS_DIR: /data/reports
      STOCKTRADER_RESEARCH_LOG: /data/research/experiments.jsonl
    mem_limit: 1g
