# .github/workflows/ci.yml — build, lint and test the workspace on every PR and on push to main.
# No secrets: the tests use wiremock loopback servers (PROFILE.md › Required services for tests).
# `cargo fmt --all --check` is not run yet: main is not rustfmt-clean today (740 hunks in 62 files at d8b8eb5);
# add the step in the same PR that reformats the tree.
name: ci
on:
  pull_request:
    paths-ignore:
      # Core D2 (0.1.22): the agent-policy set and .github/** select no product job.
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'CLAUDE.md'
      - '**/CLAUDE.md'
      - 'PROFILE.md'
      - '.agent-rules/**'
      - '.claude/**'
      - '.githooks/**'
      - '.github/**'
  push:
    branches: [main]
    paths-ignore:
      # Core D2 (0.1.22): the agent-policy set and .github/** select no product job.
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'CLAUDE.md'
      - '**/CLAUDE.md'
      - 'PROFILE.md'
      - '.agent-rules/**'
      - '.claude/**'
      - '.githooks/**'
      - '.github/**'
permissions: { contents: read }
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  ci:
    name: ci
    # Public repository: GitHub-hosted runner, no placement gate (core D9). Fork PRs run; requiring approval for
    # fork-PR workflows is a repository setting (owner).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }   # read-only job; no token left in .git/config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec   # stable branch @ 2026-10-16
        with: { components: clippy }
      - name: Declare what this runner has (D11)
        shell: bash
        run: echo "CI_LOCAL_CACHE=${CI_LOCAL_CACHE:-}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0   # v2.9.3
        if: ${{ runner.environment == 'self-hosted' && env.CI_LOCAL_CACHE == '' }}
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }   # PRs restore the cache but only main writes it
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: build (release)
        run: cargo build --workspace --release --locked
